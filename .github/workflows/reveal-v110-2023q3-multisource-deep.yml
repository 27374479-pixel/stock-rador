name: reveal-v110-2023q3-multisource-deep

on:
  push:
    branches:
      - ai-skill-v1.1-20260923
    paths:
      - .github/workflows/reveal-v110-2023q3-multisource-deep.yml

permissions:
  contents: write

jobs:
  reveal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.1-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Fetch frozen historical prices
        run: |
          node scripts/fetch-backtest-prices.cjs \
            backtests/runs/2023q3-multisource-deep-v1.1-001/lock.json \
            backtests/runs/2023q3-multisource-deep-v1.1-001/prices.json
      - name: Evaluate frozen selections
        run: |
          node scripts/evaluate-skill-run-v061.cjs \
            backtests/runs/2023q3-multisource-deep-v1.1-001/lock.json \
            backtests/runs/2023q3-multisource-deep-v1.1-001/prices.json \
            backtests/runs/2023q3-multisource-deep-v1.1-001/outcome.json
      - name: Commit diagnostic outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2023q3-multisource-deep-v1.1-001/prices.json backtests/runs/2023q3-multisource-deep-v1.1-001/outcome.json
          git commit -m "backtest: reveal v1.1 2023Q3 deep diagnostics"
          git pull --rebase origin ai-skill-v1.1-20260923
          git push origin HEAD:ai-skill-v1.1-20260923
