name: lock-v05-forward-20260922

on:
  push:
    branches:
      - ai-skill-v0.5-20260922
    paths:
      - .github/workflows/lock-v05-forward-20260922.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.5-20260922
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests before forward lock
        run: npm test

      - name: Assert outcomes do not exist
        run: |
          test ! -e backtests/runs/2026-09-22-forward-v0.5-001/prices.json
          test ! -e backtests/runs/2026-09-22-forward-v0.5-001/outcome.json

      - name: Lock forward research snapshot
        run: |
          node scripts/lock-skill-run.cjs \
            backtests/runs/2026-09-22-forward-v0.5-001/manifest.json \
            backtests/runs/2026-09-22-forward-v0.5-001/lock.json

      - name: Commit immutable forward lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-09-22-forward-v0.5-001/lock.json
          git commit -m "backtest: lock Sep 22 2026 v0.5 forward sample"
          git push origin HEAD:ai-skill-v0.5-20260922
