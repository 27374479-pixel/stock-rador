name: v1.0-ci

on:
  push:
    branches:
      - ai-skill-v1.0-20260923

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Load v1.0 auditor
        run: node -e "require('./scripts/backtest-core-v100.cjs')"
