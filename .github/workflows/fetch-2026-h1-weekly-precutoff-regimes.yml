name: fetch-2026-h1-weekly-precutoff-regimes

on:
  push:
    branches:
      - ai-skill-v2.0-2026-weekly-replay-20260926
    paths:
      - .github/workflows/fetch-2026-h1-weekly-precutoff-regimes.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2026-weekly-replay-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Fetch weekly pre-cutoff regimes
        run: |
          set -e
          D=backtests/runs/2026-h1-weekly-replay-v1.9-001/regime
          for f in memory-20260109 lithium-storage-20260116 shipping-20260306 catl-ess-20260424; do
            rm -f "$D/$f.snapshot.json"
            node scripts/fetch-precutoff-regime-hfq.cjs "$D/$f.json" "$D/$f.snapshot.json"
          done
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-h1-weekly-replay-v1.9-001/regime/*.snapshot.json
          git commit -m "backtest: freeze 2026 H1 weekly pre-cutoff regimes"
          git pull --rebase origin ai-skill-v2.0-2026-weekly-replay-20260926
          git push origin HEAD:ai-skill-v2.0-2026-weekly-replay-20260926
