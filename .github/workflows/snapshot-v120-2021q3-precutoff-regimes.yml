name: snapshot-v120-2021q3-precutoff-regimes

on:
  push:
    branches:
      - ai-skill-v1.2-20260923
    paths:
      - .github/workflows/snapshot-v120-2021q3-precutoff-regimes.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.2-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Freeze v1.2 2021Q3 pre-cutoff regimes
        run: |
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2021q3-multisource-v1.2-001/regime/shipping-20210820.json backtests/runs/2021q3-multisource-v1.2-001/regime/shipping-20210820.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2021q3-multisource-v1.2-001/regime/shipping-20210831.json backtests/runs/2021q3-multisource-v1.2-001/regime/shipping-20210831.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2021q3-multisource-v1.2-001/regime/coal-20210927.json backtests/runs/2021q3-multisource-v1.2-001/regime/coal-20210927.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2021q3-multisource-v1.2-001/regime/autochip-20210910.json backtests/runs/2021q3-multisource-v1.2-001/regime/autochip-20210910.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2021q3-multisource-v1.2-001/regime/dram-20210922.json backtests/runs/2021q3-multisource-v1.2-001/regime/dram-20210922.snapshot.json
      - name: Commit regime snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2021q3-multisource-v1.2-001/regime/*.snapshot.json
          git commit -m "backtest: freeze v1.2 2021Q3 pre-cutoff regimes"
          git pull --rebase origin ai-skill-v1.2-20260923
          git push origin HEAD:ai-skill-v1.2-20260923

