name: fetch-2020-xinbao-regime

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/fetch-2020-xinbao-regime.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const RUN='backtests/runs/2020-hubfirst-associative-v3.1-002';
          const c=JSON.parse(fs.readFileSync(RUN+'/regime-config.json','utf8'));
          const sym=t=>{const m=/^(\d{6})\.(SH|SZ)$/.exec(t);return(m[2]==='SH'?'sh':'sz')+m[1];};
          const minus=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)};
          async function get(t){const s=sym(t),u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+s+',day,'+minus(c.cutoffDate,180)+','+c.cutoffDate+',260,hfq';const r=await fetch(u,{headers:{'User-Agent':'stock-rador/1.0'},signal:AbortSignal.timeout(30000)});const j=await r.json(),n=j?.data?.[s],rows=(n?.hfqday??n?.day??[]).map(x=>({date:x[0],close:+x[2]})).sort((a,b)=>a.date.localeCompare(b.date));return{u,rows};}
          const tr=(rows,n)=>{const e=rows.at(-1),s=rows.at(-(n+1));return{startDate:s.date,endDate:e.date,return:e.close/s.close-1}};
          (async()=>{const ts=[c.benchmarkTicker,...c.tickers],ser={};for(const t of ts)ser[t]=await get(t);const b={};for(const n of c.lookbacksTradingDays)b[n]=tr(ser[c.benchmarkTicker].rows,n);const names={};for(const t of c.tickers){names[t]={};for(const n of c.lookbacksTradingDays){const r=tr(ser[t].rows,n);names[t][n]={...r,benchmarkReturn:b[n].return,excessReturn:r.return-b[n].return};}}const o={schemaVersion:'1.0',cutoffDate:c.cutoffDate,fetchedAt:new Date().toISOString(),provider:'Tencent public daily hfq',benchmark:b,names,sourceUrls:Object.fromEntries(ts.map(t=>[t,ser[t].u]))};fs.mkdirSync(RUN+'/regime',{recursive:true});fs.writeFileSync(RUN+'/regime/xinbao-20200925.snapshot.json',JSON.stringify(o,null,2)+'\n');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2020-hubfirst-associative-v3.1-002/regime/xinbao-20200925.snapshot.json
          git commit -m "backtest: fetch Xinbao cutoff regime"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
