name: reveal-2020-hubfirst-associative-v31

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/reveal-2020-hubfirst-associative-v31.yml

permissions:
  contents: write

jobs:
  reveal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify lock and reveal outcomes
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const RUN='backtests/runs/2020-hubfirst-associative-v3.1-001',BENCH='000300.SH',COST=0.001;
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const lock=JSON.parse(fs.readFileSync(RUN+'/lock.json','utf8'));
          for(const f of lock.files){ if(!fs.existsSync(f.path)||sha(f.path)!==f.sha256) throw new Error('lock mismatch '+f.path); }
          const d=JSON.parse(fs.readFileSync(RUN+'/underwriter-decisions.json','utf8'));
          const sym=t=>{const m=/^(\d{6})\.(SH|SZ)$/.exec(t);return(m[2]==='SH'?'sh':'sz')+m[1];};
          async function getSeries(ticker){
            const s=sym(ticker);
            const u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+s+',day,2020-07-01,2021-06-30,500,hfq';
            const r=await fetch(u,{headers:{'User-Agent':'stock-rador/1.0'},signal:AbortSignal.timeout(30000)});
            if(!r.ok) throw new Error('HTTP '+r.status);
            const j=await r.json(),n=j?.data?.[s],rows=(n?.hfqday??n?.day??[]).map(x=>({date:x[0],open:+x[1],close:+x[2]})).sort((a,b)=>a.date.localeCompare(b.date));
            return rows;
          }
          const net=(o,c)=>c/o*(1-COST)/(1+COST)-1;
          (async()=>{
            const ts=[BENCH,...new Set(d.frozenSelections.map(x=>x.ticker))],ser={};
            for(const t of ts) ser[t]=await getSeries(t);
            const b=ser[BENCH],results=[];
            for(const x of d.frozenSelections){
              const bi=b.findIndex(q=>q.date>x.weekEnd); if(bi<0)throw new Error('entry missing '+x.ticker);
              const entryDate=b[bi].date,a=ser[x.ticker],e=a.find(q=>q.date>=entryDate); if(!e)throw new Error('ticker entry missing');
              const horizons={};
              for(const n of [20,60,120]){
                const be=b[bi+n-1]; if(!be){horizons[n]={pending:true};continue;}
                const z=a.find(q=>q.date>=be.date); if(!z){horizons[n]={pending:true};continue;}
                const benchExit=b.find(q=>q.date>=z.date);
                const nr=net(e.open,z.close),br=benchExit.close/b[bi].open-1;
                horizons[n]={exitDate:z.date,netReturn:nr,benchmarkReturn:br,excessReturn:nr-br,positive:nr>0,excessWin:nr-br>0};
              }
              results.push({...x,entryDate:e.date,horizons});
            }
            const vals=results.map(x=>x.horizons[60]).filter(x=>!x.pending);
            const out={schemaVersion:'1.0',runId:d.runId,lockedAt:lock.lockedAt,selectionDigest:lock.selectionDigest,revealedAt:new Date().toISOString(),
              discoveryContext:{hubItems:33,associationClusters:11,underwrittenClusters:2,researchSelectionWeeks:2},
              performance60d:{count:vals.length,positiveCount:vals.filter(x=>x.positive).length,positiveRate:vals.filter(x=>x.positive).length/vals.length,excessWinCount:vals.filter(x=>x.excessWin).length,excessWinRate:vals.filter(x=>x.excessWin).length/vals.length,meanExcess:vals.reduce((s,x)=>s+x.excessReturn,0)/vals.length},
              results};
            fs.writeFileSync(RUN+'/outcome.json',JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Commit outcome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2020-hubfirst-associative-v3.1-001/outcome.json
          git commit -m "backtest: reveal 2020 hub-first associative outcomes"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
