name: snapshot-v190-2016q3-direct-dram

on:
  push:
    branches:
      - ai-skill-v1.9-2016q3-holdout-20260925
    paths:
      - .github/workflows/snapshot-v190-2016q3-direct-dram.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.9-2016q3-holdout-20260925
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Freeze direct DRAM candidate price regime
        run: |
          node scripts/fetch-precutoff-regime-hfq.cjs \
            backtests/runs/2016q3-multisource-deep-v1.9-001/regime/dram-direct-002049-20160930.json \
            backtests/runs/2016q3-multisource-deep-v1.9-001/regime/dram-direct-002049-20160930.snapshot.json
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2016q3-multisource-deep-v1.9-001/regime/dram-direct-002049-20160930.snapshot.json
          git commit -m "backtest: freeze 2016Q3 direct DRAM candidate regime"
          git pull --rebase origin ai-skill-v1.9-2016q3-holdout-20260925
          git push origin HEAD:ai-skill-v1.9-2016q3-holdout-20260925

# rerun after direct-candidate regime contract fix
