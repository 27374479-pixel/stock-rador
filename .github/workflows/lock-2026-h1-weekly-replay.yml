name: lock-2026-h1-weekly-replay

on:
  push:
    branches:
      - ai-skill-v2.0-2026-weekly-replay-20260926
    paths:
      - .github/workflows/lock-2026-h1-weekly-replay.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2026-weekly-replay-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Build weekly replay lock
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const run='backtests/runs/2026-h1-weekly-replay-v1.9-001';
          const decisionPath=run+'/weekly-decisions.json';
          const decision=JSON.parse(fs.readFileSync(decisionPath,'utf8'));
          const fixed=[
            decisionPath,
            run+'/weekly-source-extension.json',
            'backtests/runs/2026q1-multisource-deep-v0.6-001/source-pack.json',
            'backtests/runs/2026q2-multisource-deep-v0.7-001/source-pack.json'
          ];
          const regimes=fs.readdirSync(run+'/regime')
            .filter(x=>x.endsWith('.snapshot.json'))
            .sort()
            .map(x=>run+'/regime/'+x);
          const paths=[...fixed,...regimes];
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const lock={
            schemaVersion:'1.0',
            runId:decision.runId,
            lockedAt:new Date().toISOString(),
            validationClass:decision.validationClass,
            candidateCount:decision.frozenSelections.length,
            selectionDigest:crypto.createHash('sha256').update(JSON.stringify(decision.frozenSelections)).digest('hex'),
            files:paths.map(p=>({path:p,sha256:sha(p)}))
          };
          fs.writeFileSync(run+'/lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-h1-weekly-replay-v1.9-001/lock.json
          git commit -m "backtest: lock 2026 H1 weekly replay"
          git pull --rebase origin ai-skill-v2.0-2026-weekly-replay-20260926
          git push origin HEAD:ai-skill-v2.0-2026-weekly-replay-20260926
