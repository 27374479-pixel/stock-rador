name: fetch-2024-weekly-precutoff-regimes

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/fetch-2024-weekly-precutoff-regimes.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Fetch 2024 weekly pre-cutoff regimes
        run: |
          set -e
          D=backtests/runs/2024-weekly-broadsource-v1.9-001/regime
          for f in shipping-20240112 gold-20240426 auto-20240503 shipping-20240628 pork-20240712 shipbuilding-20240719 appliance-20240823 machinery-20240913; do
            rm -f "$D/$f.snapshot.json"
            node scripts/fetch-precutoff-regime-hfq.cjs "$D/$f.json" "$D/$f.snapshot.json"
          done
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2024-weekly-broadsource-v1.9-001/regime/*.snapshot.json
          git commit -m "backtest: freeze 2024 weekly pre-cutoff regimes"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
