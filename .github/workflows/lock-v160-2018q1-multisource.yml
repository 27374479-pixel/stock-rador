name: lock-v160-2018q1-multisource

on:
  push:
    branches:
      - ai-skill-v1.6-2018q1-holdout-20260924
    paths:
      - .github/workflows/lock-v160-2018q1-multisource.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.6-2018q1-holdout-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Lock v1.6 2018Q1 discovery holdout
        run: |
          node scripts/lock-skill-run-v160.cjs \
            backtests/runs/2018q1-multisource-v1.6-001/manifest.json \
            backtests/runs/2018q1-multisource-v1.6-001/lock.json
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2018q1-multisource-v1.6-001/lock.json
          git commit -m "backtest: lock v1.6 2018Q1 discovery holdout"
          git pull --rebase origin ai-skill-v1.6-2018q1-holdout-20260924
          git push origin HEAD:ai-skill-v1.6-2018q1-holdout-20260924
