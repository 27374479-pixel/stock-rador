name: diagnose-v190-2017q1-regime-coverage

on:
  push:
    branches:
      - ai-skill-v1.9-2017q1-holdout-20260924
    paths:
      - .github/workflows/diagnose-v190-2017q1-regime-coverage.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Count cutoff-valid Tencent hfq rows
        run: |
          node - <<'NODE'
          const pairs = [
            ['600309.SH','sh600309'],['002165.SZ','sz002165'],['600230.SH','sh600230'],
            ['603986.SH','sh603986'],['300327.SZ','sz300327'],['600584.SH','sh600584'],
            ['002601.SZ','sz002601'],['002136.SZ','sz002136'],['002145.SZ','sz002145'],
            ['603799.SH','sh603799'],['603993.SH','sh603993'],['002340.SZ','sz002340']
          ];
          for (const [t,q] of pairs) {
            const u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+q+',day,2016-11-01,2017-03-31,300,hfq';
            const r=await fetch(u); const j=await r.json();
            const v=Object.values(j.data||{})[0]||{}; const rows=v.hfqday||v.day||[];
            console.log(t, rows.length, rows[0]?.[0], rows.at(-1)?.[0]);
          }
          NODE
