name: reveal-v150-2019q2-multisource-deep

on:
  push:
    branches:
      - ai-skill-v1.5-2019q2-holdout-20260924
    paths:
      - .github/workflows/reveal-v150-2019q2-multisource-deep.yml

permissions:
  contents: write

jobs:
  reveal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.5-2019q2-holdout-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Fetch frozen historical prices
        run: |
          node scripts/fetch-backtest-prices-hfq.cjs \
            backtests/runs/2019q2-multisource-deep-v1.5-001/lock.json \
            backtests/runs/2019q2-multisource-deep-v1.5-001/prices.json
      - name: Evaluate frozen selections
        run: |
          node scripts/evaluate-skill-run-v150.cjs \
            backtests/runs/2019q2-multisource-deep-v1.5-001/lock.json \
            backtests/runs/2019q2-multisource-deep-v1.5-001/prices.json \
            backtests/runs/2019q2-multisource-deep-v1.5-001/outcome.json
      - name: Commit diagnostic outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2019q2-multisource-deep-v1.5-001/prices.json backtests/runs/2019q2-multisource-deep-v1.5-001/outcome.json
          git commit -m "backtest: reveal v1.5 2019Q2 deep diagnostics"
          git pull --rebase origin ai-skill-v1.5-2019q2-holdout-20260924
          git push origin HEAD:ai-skill-v1.5-2019q2-holdout-20260924
