name: test-v180-candidate

on:
  push:
    branches:
      - ai-skill-v1.8-company-exception-20260924
    paths:
      - .github/workflows/test-v180-candidate.yml
      - skills/stock-rador/versions/1.8.0/SKILL.md
      - scripts/backtest-core-v180.cjs
      - scripts/lock-skill-run-v180.cjs
      - scripts/evaluate-skill-run-v180.cjs
      - tests/backtest-core-v180.test.js

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.8-company-exception-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
