name: lock-v150-2019q1-multisource-deep

on:
  push:
    branches:
      - ai-skill-v1.5-2019q1-holdout-20260924
    paths:
      - .github/workflows/lock-v150-2019q1-multisource-deep.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.5-2019q1-holdout-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Assert outcome files absent before lock
        run: |
          test ! -e backtests/runs/2019q1-multisource-deep-v1.5-001/prices.json
          test ! -e backtests/runs/2019q1-multisource-deep-v1.5-001/outcome.json
      - name: Lock v1.5 2019Q1 deep holdout
        run: |
          node scripts/lock-skill-run-v150.cjs \
            backtests/runs/2019q1-multisource-deep-v1.5-001/manifest.json \
            backtests/runs/2019q1-multisource-deep-v1.5-001/lock.json
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2019q1-multisource-deep-v1.5-001/lock.json
          git commit -m "backtest: lock v1.5 2019Q1 deep holdout"
          git pull --rebase origin ai-skill-v1.5-2019q1-holdout-20260924
          git push origin HEAD:ai-skill-v1.5-2019q1-holdout-20260924

