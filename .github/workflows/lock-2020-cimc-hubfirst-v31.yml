name: lock-2020-cimc-hubfirst-v31

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/lock-2020-cimc-hubfirst-v31.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const run='backtests/runs/2020-hubfirst-associative-v3.1-006';
          const d=JSON.parse(fs.readFileSync(run+'/underwriter-decisions.json','utf8'));
          const paths=['backtests/hub-first-associative-discovery-protocol-v3.1.json',run+'/mapping-cimc-container-bottleneck.json',run+'/regime-config.json',run+'/regime/cimc-20201030.snapshot.json',run+'/underwriter-decisions.json'];
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const lock={schemaVersion:'1.0',runId:d.runId,lockedAt:new Date().toISOString(),validationClass:d.validationClass,candidateCount:1,selectionDigest:crypto.createHash('sha256').update(JSON.stringify(d.frozenSelections)).digest('hex'),files:paths.map(p=>({path:p,sha256:sha(p)}))};
          fs.writeFileSync(run+'/lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2020-hubfirst-associative-v3.1-006/lock.json
          git commit -m "backtest: lock CIMC hub-first selection"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
