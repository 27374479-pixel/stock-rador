name: reveal-2020-fosun-hubfirst-v31

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/reveal-2020-fosun-hubfirst-v31.yml

permissions:
  contents: write

jobs:
  reveal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const RUN='backtests/runs/2020-hubfirst-associative-v3.1-003',BENCH='000300.SH',COST=0.001;
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const lock=JSON.parse(fs.readFileSync(RUN+'/lock.json','utf8'));
          for(const f of lock.files){if(!fs.existsSync(f.path)||sha(f.path)!==f.sha256)throw new Error('lock mismatch '+f.path);}
          const d=JSON.parse(fs.readFileSync(RUN+'/underwriter-decisions.json','utf8'));
          const sym=t=>{const m=/^(\d{6})\.(SH|SZ)$/.exec(t);return(m[2]==='SH'?'sh':'sz')+m[1];};
          async function get(t){const s=sym(t),u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+s+',day,2020-10-01,2021-09-30,600,hfq';const r=await fetch(u,{headers:{'User-Agent':'stock-rador/1.0'},signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),n=j?.data?.[s],rows=(n?.hfqday??n?.day??[]).map(x=>({date:x[0],open:+x[1],close:+x[2]})).sort((a,b)=>a.date.localeCompare(b.date));return rows;}
          const net=(o,c)=>c/o*(1-COST)/(1+COST)-1;
          (async()=>{const x=d.frozenSelections[0],b=await get(BENCH),a=await get(x.ticker),bi=b.findIndex(q=>q.date>x.weekEnd),e=a.find(q=>q.date>=b[bi].date),h={};for(const n of [20,60,120]){const be=b[bi+n-1],z=a.find(q=>q.date>=be.date),bb=b.find(q=>q.date>=z.date),nr=net(e.open,z.close),br=bb.close/b[bi].open-1;h[n]={exitDate:z.date,netReturn:nr,benchmarkReturn:br,excessReturn:nr-br,positive:nr>0,excessWin:nr-br>0};}const out={schemaVersion:'1.0',runId:d.runId,lockedAt:lock.lockedAt,selectionDigest:lock.selectionDigest,revealedAt:new Date().toISOString(),result:{...x,entryDate:e.date,horizons:h}};fs.writeFileSync(RUN+'/outcome.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2020-hubfirst-associative-v3.1-003/outcome.json
          git commit -m "backtest: reveal Fosun BioNTech hub-first outcome"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
