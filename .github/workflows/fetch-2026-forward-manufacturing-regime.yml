name: fetch-2026-forward-manufacturing-regime
on:
  push:
    branches: [ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926]
    paths: [.github/workflows/fetch-2026-forward-manufacturing-regime.yml]
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const RUN='backtests/runs/2026-09-27-forward-hubfirst-v3.2-001';
          const c=JSON.parse(fs.readFileSync(RUN+'/manufacturing-regime-config.json','utf8'));
          const sym=t=>{const m=/^(\d{6})\.(SH|SZ)$/.exec(t);return(m[2]==='SH'?'sh':'sz')+m[1]};
          const minus=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)};
          async function get(t){const s=sym(t),u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+s+',day,'+minus(c.cutoffDate,260)+','+c.cutoffDate+',400,hfq';const r=await fetch(u,{headers:{'User-Agent':'stock-rador-forward-v3.2/1.0'},signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json(),n=j?.data?.[s],rows=(n?.hfqday??n?.day??[]).map(x=>({date:x[0],close:+x[2]})).sort((a,b)=>a.date.localeCompare(b.date));return{url:u,rows}}
          const tr=(a,n)=>{const e=a.at(-1),s=a.at(-(n+1));return{startDate:s.date,endDate:e.date,return:e.close/s.close-1}};
          (async()=>{const ts=[c.benchmarkTicker,...c.tickers],ser={};for(const t of ts)ser[t]=await get(t);const benchmark={};for(const n of c.lookbacksTradingDays)benchmark[n]=tr(ser[c.benchmarkTicker].rows,n);const names={};for(const t of c.tickers){names[t]={};for(const n of c.lookbacksTradingDays){const z=tr(ser[t].rows,n);names[t][n]={...z,benchmarkReturn:benchmark[n].return,excessReturn:z.return-benchmark[n].return}}}const out={schemaVersion:'1.0',snapshotId:c.snapshotId,cutoffDate:c.cutoffDate,fetchedAt:new Date().toISOString(),benchmark,names,sourceUrls:Object.fromEntries(ts.map(t=>[t,ser[t].url]))};fs.mkdirSync(RUN+'/regime',{recursive:true});fs.writeFileSync(RUN+'/regime/'+c.snapshotId+'.snapshot.json',JSON.stringify(out,null,2)+'\n')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-09-27-forward-hubfirst-v3.2-001/regime/manufacturing-export-20260925.snapshot.json
          git commit -m "forward: fetch manufacturing export regime"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
