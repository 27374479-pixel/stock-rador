name: snapshot-v130-2020q4-precutoff-regimes

on:
  push:
    branches:
      - ai-skill-v1.3-20260923
    paths:
      - .github/workflows/snapshot-v130-2020q4-precutoff-regimes.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.3-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Freeze v1.3 2020Q4 pre-cutoff regimes
        run: |
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2020q4-multisource-v1.3-001/regime/shipping-20201210.json backtests/runs/2020q4-multisource-v1.3-001/regime/shipping-20201210.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2020q4-multisource-v1.3-001/regime/nev-20201214.json backtests/runs/2020q4-multisource-v1.3-001/regime/nev-20201214.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2020q4-multisource-v1.3-001/regime/metals-20201231.json backtests/runs/2020q4-multisource-v1.3-001/regime/metals-20201231.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2020q4-multisource-v1.3-001/regime/dram-20201125.json backtests/runs/2020q4-multisource-v1.3-001/regime/dram-20201125.snapshot.json
      - name: Commit regime snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2020q4-multisource-v1.3-001/regime/*.snapshot.json
          git commit -m "backtest: freeze v1.3 2020Q4 pre-cutoff regimes"
          git pull --rebase origin ai-skill-v1.3-20260923
          git push origin HEAD:ai-skill-v1.3-20260923
