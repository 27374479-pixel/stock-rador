name: lock-v061-q4-multisource-deep

on:
  push:
    branches:
      - ai-skill-v0.6-20260922
    paths:
      - .github/workflows/lock-v061-q4-multisource-deep.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.6-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Lock software-only replay
        run: |
          node scripts/lock-skill-run.cjs \
            backtests/runs/2025q4-multisource-deep-v0.6-002/manifest.json \
            backtests/runs/2025q4-multisource-deep-v0.6-002/lock.json
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2025q4-multisource-deep-v0.6-002/lock.json
          git commit -m "backtest: lock v0.6.1 partial-horizon Q4 replay"
          git push origin HEAD:ai-skill-v0.6-20260922
