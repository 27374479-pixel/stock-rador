name: lock-2023-hubfirst-v32

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/lock-2023-hubfirst-v32.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build immutable lock
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const run='backtests/runs/2023-hubfirst-causal-neighborhood-v3.2-001';
          if(fs.existsSync(run+'/outcome.json')) throw new Error('outcome already exists before lock');
          const d=JSON.parse(fs.readFileSync(run+'/underwriter-decisions.json','utf8'));
          const paths=[
            'config/source-registry-v4-hub-first.json',
            'backtests/hub-first-causal-neighborhood-protocol-v3.2-candidate.json',
            run+'/discovery-pack.json',
            run+'/mapping-product-tanker.json',
            run+'/mapping-auto-roro.json',
            run+'/mapping-mobility-airport.json',
            run+'/mapping-producer-deflation-power.json',
            run+'/expectation-snapshot.json',
            run+'/regime-config.json',
            run+'/additional-regime-config.json',
            run+'/regime/product-tanker-20230421.snapshot.json',
            run+'/regime/auto-roro-20230901.snapshot.json',
            run+'/regime/mobility-airport-20230505.snapshot.json',
            run+'/regime/producer-deflation-power-20230630.snapshot.json',
            run+'/underwriter-decisions.json',
            run+'/evaluation-plan.json'
          ];
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          for(const p of paths) if(!fs.existsSync(p)) throw new Error('missing '+p);
          const lock={
            schemaVersion:'1.0',
            runId:d.runId,
            lockedAt:new Date().toISOString(),
            validationClass:d.validationClass,
            protocol:'v3.2-candidate-external-replication',
            existing2023OutcomeFilesReadBeforeLock:false,
            outcomeAbsentAtLock:true,
            candidateCount:d.frozenSelections.length,
            selectionDigest:crypto.createHash('sha256').update(JSON.stringify(d.frozenSelections)).digest('hex'),
            discoveryDenominator:{hubItemCount:18,associationClusterCount:7},
            files:paths.map(p=>({path:p,sha256:sha(p)}))
          };
          fs.writeFileSync(run+'/lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2023-hubfirst-causal-neighborhood-v3.2-001/lock.json
          git commit -m "backtest: lock 2023 v3.2 external replication"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
