name: verify-v06-2026q1-lock

on:
  push:
    branches:
      - ai-skill-v0.6-20260922
    paths:
      - .github/workflows/verify-v06-2026q1-lock.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.6-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Verify existing Q1 frozen lock against current files
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { verifyLock } = require('./scripts/backtest-core.cjs');
          const lock = JSON.parse(fs.readFileSync('backtests/runs/2026q1-multisource-v0.6-001/lock.json','utf8'));
          const mismatches = verifyLock(lock, process.cwd());
          if (mismatches.length) {
            console.error(mismatches.join('\n'));
            process.exit(1);
          }
          console.log(JSON.stringify({
            runId: lock.runId,
            lockedAt: lock.lockedAt,
            discoverySummary: lock.discoverySummary,
            verified: true
          }, null, 2));
          NODE
