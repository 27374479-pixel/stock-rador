name: snapshot-v120-2021q4-power-postq3

on:
  push:
    branches:
      - ai-skill-v1.2-20260923
    paths:
      - .github/workflows/snapshot-v120-2021q4-power-postq3.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.2-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/fetch-precutoff-regime.cjs backtests/runs/2021q4-multisource-v1.2-001/regime/power-20211101.json backtests/runs/2021q4-multisource-v1.2-001/regime/power-20211101.snapshot.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2021q4-multisource-v1.2-001/regime/power-20211101.snapshot.json
          git commit -m "backtest: freeze v1.2 2021Q4 post-Q3 power regime"
          git pull --rebase origin ai-skill-v1.2-20260923
          git push origin HEAD:ai-skill-v1.2-20260923
