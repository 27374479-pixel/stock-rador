name: freeze-v06-forward-audit-universe
# trigger-1

on:
  push:
    branches:
      - ai-skill-v0.6-20260922
    paths:
      - .github/workflows/freeze-v06-forward-audit-universe.yml

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.6-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Assert future audit has not been generated
        run: |
          test ! -e backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe.json
          test ! -e backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe-lock.json
          test ! -e backtests/runs/2026-09-22-forward-discovery-v0.6-001/missed-opportunities.json
          test ! -e backtests/runs/2026-09-22-forward-discovery-v0.6-001/discovery-audit.json
      - name: Fetch exact prospective A-share audit universe
        run: |
          node scripts/fetch-a-share-audit-universe.cjs \
            backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe.json \
            2026-09-22
      - name: Lock universe against original discovery lock
        run: |
          node scripts/lock-audit-universe.cjs \
            backtests/runs/2026-09-22-forward-discovery-v0.6-001/lock.json \
            backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe.json \
            backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe-lock.json
      - name: Commit prospective audit universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe.json
          git add backtests/runs/2026-09-22-forward-discovery-v0.6-001/audit-universe-lock.json
          git commit -m "audit: freeze Sep 22 forward A-share universe"
          git push origin HEAD:ai-skill-v0.6-20260922
