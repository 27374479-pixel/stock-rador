name: lock-v06-2026q1-multisource
# retry-1

on:
  push:
    branches:
      - ai-skill-v0.6-20260922
    paths:
      - .github/workflows/lock-v06-2026q1-multisource.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.6-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Lock unchanged-v0.6 Q1 discovery
        run: |
          node scripts/lock-skill-run.cjs \
            backtests/runs/2026q1-multisource-v0.6-001/manifest.json \
            backtests/runs/2026q1-multisource-v0.6-001/lock.json
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026q1-multisource-v0.6-001/lock.json
          git commit -m "backtest: lock unchanged-v0.6 2026Q1 discovery"
          git pull --rebase origin ai-skill-v0.6-20260922
          git push origin HEAD:ai-skill-v0.6-20260922
