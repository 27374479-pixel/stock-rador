name: lock-v06-forward-discovery-20260922
# retry-1

on:
  push:
    branches:
      - ai-skill-v0.6-20260922
    paths:
      - .github/workflows/lock-v06-forward-discovery-20260922.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.6-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Assert future discovery audit does not exist
        run: |
          test ! -e backtests/runs/2026-09-22-forward-discovery-v0.6-001/missed-opportunities.json
          test ! -e backtests/runs/2026-09-22-forward-discovery-v0.6-001/discovery-audit.json
      - name: Lock forward discovery snapshot
        run: |
          node scripts/lock-skill-run.cjs \
            backtests/runs/2026-09-22-forward-discovery-v0.6-001/manifest.json \
            backtests/runs/2026-09-22-forward-discovery-v0.6-001/lock.json
      - name: Commit forward discovery lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-09-22-forward-discovery-v0.6-001/lock.json
          git commit -m "backtest: lock v0.6 Sep 22 forward discovery snapshot"
          git push origin HEAD:ai-skill-v0.6-20260922
