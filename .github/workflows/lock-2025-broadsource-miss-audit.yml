name: lock-2025-broadsource-miss-audit

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/lock-2025-broadsource-miss-audit.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Build miss-audit lock
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const run='backtests/runs/2025-broadsource-miss-audit-v1';
          const d=JSON.parse(fs.readFileSync(run+'/decisions.json','utf8'));
          const paths=[run+'/decisions.json',...fs.readdirSync(run+'/regime').filter(x=>x.endsWith('.snapshot.json')).sort().map(x=>run+'/regime/'+x)];
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const lock={schemaVersion:'1.0',runId:d.runId,lockedAt:new Date().toISOString(),validationClass:d.validationClass,candidateCount:d.frozenSelections.length,selectionDigest:crypto.createHash('sha256').update(JSON.stringify(d.frozenSelections)).digest('hex'),files:paths.map(p=>({path:p,sha256:sha(p)}))};
          fs.writeFileSync(run+'/lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2025-broadsource-miss-audit-v1/lock.json
          git commit -m "backtest: lock 2025 broad-source miss audit"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
