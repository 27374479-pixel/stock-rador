name: snapshot-v110-2022q2-precutoff-regimes

on:
  push:
    branches:
      - ai-skill-v1.1-20260923
    paths:
      - .github/workflows/snapshot-v110-2022q2-precutoff-regimes.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v1.1-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Freeze v1.1 2022Q2 pre-cutoff regimes
        run: |
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2022q2-multisource-v1.1-001/regime/auto-20220610.json backtests/runs/2022q2-multisource-v1.1-001/regime/auto-20220610.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2022q2-multisource-v1.1-001/regime/coal-20220627.json backtests/runs/2022q2-multisource-v1.1-001/regime/coal-20220627.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2022q2-multisource-v1.1-001/regime/pv-upstream-20220627.json backtests/runs/2022q2-multisource-v1.1-001/regime/pv-upstream-20220627.snapshot.json
      - name: Commit regime snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2022q2-multisource-v1.1-001/regime/*.snapshot.json
          git commit -m "backtest: freeze v1.1 2022Q2 pre-cutoff regimes"
          git pull --rebase origin ai-skill-v1.1-20260923
          git push origin HEAD:ai-skill-v1.1-20260923
