name: reveal-2026-h1-weekly-replay

on:
  push:
    branches:
      - ai-skill-v2.0-2026-weekly-replay-20260926
    paths:
      - .github/workflows/reveal-2026-h1-weekly-replay.yml

permissions:
  contents: write

jobs:
  reveal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2026-weekly-replay-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Fetch post-lock prices and evaluate weekly replay
        run: |
          rm -f backtests/runs/2026-h1-weekly-replay-v1.9-001/weekly-outcome.json
          node scripts/evaluate-2026-h1-weekly-replay.cjs
      - name: Commit weekly outcome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-h1-weekly-replay-v1.9-001/weekly-outcome.json
          git commit -m "backtest: reveal 2026 H1 weekly 60d outcomes"
          git pull --rebase origin ai-skill-v2.0-2026-weekly-replay-20260926
          git push origin HEAD:ai-skill-v2.0-2026-weekly-replay-20260926
