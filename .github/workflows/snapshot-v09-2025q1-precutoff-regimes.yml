name: snapshot-v09-2025q1-precutoff-regimes

on:
  push:
    branches:
      - ai-skill-v0.9-20260923
    paths:
      - .github/workflows/snapshot-v09-2025q1-precutoff-regimes.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.9-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Freeze pre-cutoff price regimes
        run: |
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2025q1-multisource-v0.9-001/regime/optical-20250228.json backtests/runs/2025q1-multisource-v0.9-001/regime/optical-20250228.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2025q1-multisource-v0.9-001/regime/power-20250228.json backtests/runs/2025q1-multisource-v0.9-001/regime/power-20250228.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2025q1-multisource-v0.9-001/regime/gold-20250331.json backtests/runs/2025q1-multisource-v0.9-001/regime/gold-20250331.snapshot.json
          node scripts/fetch-precutoff-regime.cjs backtests/runs/2025q1-multisource-v0.9-001/regime/tungsten-20250304.json backtests/runs/2025q1-multisource-v0.9-001/regime/tungsten-20250304.snapshot.json
      - name: Commit regime snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2025q1-multisource-v0.9-001/regime/*.snapshot.json
          git commit -m "backtest: freeze v0.9 2025Q1 pre-cutoff regimes"
          git pull --rebase origin ai-skill-v0.9-20260923
          git push origin HEAD:ai-skill-v0.9-20260923
