name: lock-v07-2026q2-multisource-deep

on:
  push:
    branches:
      - ai-skill-v0.7-20260923
    paths:
      - .github/workflows/lock-v07-2026q2-multisource-deep.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.7-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Lock v0.7 Q2 deep-research holdout
        run: |
          node scripts/lock-skill-run-v070.cjs \
            backtests/runs/2026q2-multisource-deep-v0.7-001/manifest.json \
            backtests/runs/2026q2-multisource-deep-v0.7-001/lock.json
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026q2-multisource-deep-v0.7-001/lock.json
          git commit -m "backtest: lock v0.7 2026Q2 deep-research holdout"
          git pull --rebase origin ai-skill-v0.7-20260923
          git push origin HEAD:ai-skill-v0.7-20260923
