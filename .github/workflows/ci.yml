name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test

  evaluate-skill-v3-2024-06:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/evaluate-skill-v3-window-2024-06.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: skill-v3-2024-06-outcomes
          path: |
            research/skill_v3_2024_06_outcomes.json
            research/skill_v3_2024_06_outcomes.md
          if-no-files-found: error

# Historical freeze/evaluation scripts are intentionally not replayed on every
# push. Their committed locks and workflow artifacts are point-in-time records.
# Only the active untouched-window stage is attached to routine CI.


