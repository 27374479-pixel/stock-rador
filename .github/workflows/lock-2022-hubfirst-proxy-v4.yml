name: lock-2022-hubfirst-proxy-v4

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/lock-2022-hubfirst-proxy-v4.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Validate discovery files
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const {validateDiscoveryPack,validateDiscoveryScreening}=require('./scripts/discovery-core.cjs');
          const base='backtests/runs/2022-hubfirst-proxy-v4-001';
          const m=JSON.parse(fs.readFileSync(base+'/manifest.json','utf8'));
          const p=JSON.parse(fs.readFileSync(base+'/source-pack.json','utf8'));
          const s=JSON.parse(fs.readFileSync(base+'/screening.json','utf8'));
          const errors=[...validateDiscoveryPack(p,m),...validateDiscoveryScreening(s,p,m)];
          if(errors.length){console.error(errors.join('\n'));process.exit(1);}
          NODE
      - name: Build lock
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const run='backtests/runs/2022-hubfirst-proxy-v4-001';
          const d=JSON.parse(fs.readFileSync(run+'/underwriter-decisions.json','utf8'));
          const paths=[
            run+'/manifest.json',run+'/source-pack.json',run+'/screening.json',
            run+'/validation-evidence.json',run+'/underwriter-decisions.json',
            ...fs.readdirSync(run+'/regime').filter(x=>x.endsWith('.snapshot.json')).sort().map(x=>run+'/regime/'+x)
          ];
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const lock={
            schemaVersion:'1.0',runId:d.runId,lockedAt:new Date().toISOString(),
            validationClass:d.validationClass,candidateCount:d.frozenSelections.length,
            selectionDigest:crypto.createHash('sha256').update(JSON.stringify(d.frozenSelections)).digest('hex'),
            files:paths.map(p=>({path:p,sha256:sha(p)}))
          };
          fs.writeFileSync(run+'/lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2022-hubfirst-proxy-v4-001/lock.json
          git commit -m "backtest: lock 2022 hub-first proxy decisions"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
