name: fetch-2026-forward-hubfirst-regimes

on:
  push:
    branches:
      - ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
    paths:
      - .github/workflows/fetch-2026-forward-hubfirst-regimes.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const RUN='backtests/runs/2026-09-27-forward-hubfirst-v3.2-001';
          const c=JSON.parse(fs.readFileSync(RUN+'/regime-config.json','utf8'));
          const tickers=[...new Set(Object.values(c.groups).flat())];
          const sym=t=>{const m=/^(\d{6})\.(SH|SZ)$/.exec(t);if(!m)throw new Error('bad '+t);return(m[2]==='SH'?'sh':'sz')+m[1];};
          const minus=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)};
          async function get(t){
            const s=sym(t),u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+s+',day,'+minus(c.cutoffDate,260)+','+c.cutoffDate+',400,hfq';
            const r=await fetch(u,{headers:{'User-Agent':'stock-rador-forward-v3.2/1.0'},signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw new Error('HTTP '+r.status);
            const j=await r.json(),n=j?.data?.[s],rows=(n?.hfqday??n?.day??[]).map(x=>({date:x[0],open:+x[1],close:+x[2]})).sort((a,b)=>a.date.localeCompare(b.date));
            if(rows.length<125)throw new Error('too few '+t+' '+rows.length);
            return {url:u,rows};
          }
          const tr=(rows,n)=>{const e=rows.at(-1),s=rows.at(-(n+1));return{startDate:s.date,endDate:e.date,return:e.close/s.close-1}};
          (async()=>{
            const ts=[c.benchmarkTicker,...tickers],ser={};for(const t of ts)ser[t]=await get(t);
            const b={};for(const n of c.lookbacksTradingDays)b[n]=tr(ser[c.benchmarkTicker].rows,n);
            const names={};for(const t of tickers){names[t]={};for(const n of c.lookbacksTradingDays){const z=tr(ser[t].rows,n);names[t][n]={...z,benchmarkReturn:b[n].return,excessReturn:z.return-b[n].return};}}
            const out={schemaVersion:'1.0',runId:c.runId,cutoffDate:c.cutoffDate,fetchedAt:new Date().toISOString(),provider:'Tencent public daily hfq',benchmark:b,groups:c.groups,names,sourceUrls:Object.fromEntries(ts.map(t=>[t,ser[t].url]))};
            fs.mkdirSync(RUN+'/regime',{recursive:true});fs.writeFileSync(RUN+'/regime/forward-20260925.snapshot.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2026-09-27-forward-hubfirst-v3.2-001/regime/forward-20260925.snapshot.json
          git commit -m "forward: fetch 2026-09-25 hub-first regimes"
          git pull --rebase origin ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
          git push origin HEAD:ai-skill-v2.0-2024-2025-weekly-diagnostic-20260926
