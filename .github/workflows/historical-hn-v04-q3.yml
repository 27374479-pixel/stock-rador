name: historical-hn-v04-q3

on:
  push:
    branches:
      - ai-skill-v0.4-20260922
    paths:
      - .github/workflows/historical-hn-v04-q3.yml

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.4-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Collect frozen Q3 2025 source pack
        run: |
          node scripts/collect-hn-generic.cjs \
            --start 2025-07-01 \
            --end 2025-10-01 \
            --max-pages 3 \
            --review-limit 120 \
            --out backtests/runs/2025q3-hn-v0.4-001/source-pack.json
      - name: Commit source pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2025q3-hn-v0.4-001/source-pack.json
          git commit -m "data: freeze 2025Q3 generic HN source pack"
          git push origin HEAD:ai-skill-v0.4-20260922
