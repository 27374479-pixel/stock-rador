name: reveal-and-evaluate-v04-q3

on:
  push:
    branches:
      - ai-skill-v0.4-20260922
    paths:
      - .github/workflows/reveal-and-evaluate-v04-q3.yml

permissions:
  contents: write

jobs:
  reveal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-skill-v0.4-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests before reveal
        run: npm test
      - name: Fetch selected, benchmark and frozen controls
        run: |
          node scripts/fetch-backtest-prices.cjs \
            backtests/runs/2025q3-hn-v0.4-001/lock.json \
            backtests/runs/2025q3-hn-v0.4-001/prices.json
      - name: Evaluate broad and matched-control outcomes
        run: |
          node scripts/evaluate-skill-run.cjs \
            backtests/runs/2025q3-hn-v0.4-001/lock.json \
            backtests/runs/2025q3-hn-v0.4-001/prices.json \
            backtests/runs/2025q3-hn-v0.4-001/outcome.json
      - name: Commit revealed outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/runs/2025q3-hn-v0.4-001/prices.json
          git add backtests/runs/2025q3-hn-v0.4-001/outcome.json
          git commit -m "backtest: reveal v0.4 Q3 matched-control outcomes"
          git push origin HEAD:ai-skill-v0.4-20260922
